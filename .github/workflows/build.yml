name: Build Android BD-J Zero runtimes

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        type: choice
        required: true
        default: all
        options:
          - all
          - armeabi-v7a
          - arm64-v8a

permissions:
  contents: read

concurrency:
  group: bdj-zero-${{ github.ref }}-${{ inputs.abi }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'all' && '["armeabi-v7a", "arm64-v8a"]' || format('["{0}"]', inputs.abi)) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            unzip zip python3 gcc-multilib g++-multilib systemtap-sdt-dev \
            libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev

      - name: Verify build tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Build complete target runtime
        env:
          BDJ_ABI: ${{ matrix.abi }}
        run: bash tools/build_zero_runtime.sh "$BDJ_ABI"

      - name: Upload runtime and probe
        uses: actions/upload-artifact@v7
        with:
          name: bdj-zero-${{ matrix.abi }}
          path: buildout/${{ matrix.abi }}/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: bdj-zero-${{ matrix.abi }}-symbols
          path: buildout/${{ matrix.abi }}/debug-symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdj-zero-${{ matrix.abi }}-build-logs
          path: |
            buildout/${{ matrix.abi }}/*.log
            buildout/${{ matrix.abi }}/*.json
            buildout/${{ matrix.abi }}/jdk8u-*/build/*/config.log
            buildout/${{ matrix.abi }}/jdk8u-*/build/*/spec.gmk
            buildout/${{ matrix.abi }}/jdk8u-*/build/*/hotspot/**/*.log
          if-no-files-found: ignore
          retention-days: 30
